app = "tracking-app-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  JWT_ACCESS_EXPIRES = "15m"
  JWT_REFRESH_EXPIRES = "30d"
  TRIAL_DEFAULT_DURATION_DAYS = "14"
  TRIAL_EXPIRING_SOON_DAYS = "3"
  FRONTEND_URL = "https://tracking-app-ten-sable.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
